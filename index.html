    <meta
      name="description"
      content="An ink-wash climb up a hanging scroll. Nothing here explains itself in words."

    <meta property="og:type" content="website" />

  <body>
    <!--
      There is deliberately no visible copy on this page. The brief forbids a
      tutorial "on screen or off", so the heading and the navigation below are
      here for assistive tech and for the spec's structural invariants, not as
      a place to explain the controls. They reveal themselves on keyboard
      focus and are otherwise out of the way.
    -->
    <header>
      <nav aria-label="Primary">
        <a class="visually-hidden" href="./">Ascent — home</a>
      </nav>
    </header>

    <main>
      <h1 class="visually-hidden">Ascent</h1>
      <!--
        The label names the game and stops there. "Use the arrow keys" would
        be a tutorial hiding in an attribute, and the rule says on screen or
        off.
      -->
      <canvas id="stage" aria-label="Ascent"></canvas>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
